<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FreshRoute Wireframes v1</title>
<style>
@page { size: 1600px 1000px; margin: 0; }
:root{
  --ink:#1c1c1e; --ink2:#48484a; --ink3:#8e8e93; --line:#d1d1d6; --line2:#e5e5ea;
  --fill:#f2f2f7; --fill2:#e9e9ee; --paper:#fafaf8; --dark:#3a3a3c;
  --note:#d9480f; --noteBg:#fff4ec;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:1600px;height:1000px;background:var(--paper);position:relative;overflow:hidden;page-break-after:always;break-after:page;margin:0 auto 24px}
@media print{.page{margin:0}}
.ph{position:absolute;left:48px;right:48px;top:32px;height:60px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
.ph h1{font-size:26px;font-weight:650;letter-spacing:-.3px}
.ph .tag{font-size:13px;color:var(--ink2);display:flex;gap:10px;align-items:center}
.chip{display:inline-block;border:1px solid var(--ink2);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.chip.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{position:absolute;left:48px;top:118px;width:1040px;height:840px;display:flex;align-items:center;justify-content:center;gap:28px}
.notes{position:absolute;left:1120px;right:48px;top:118px;bottom:42px;overflow:hidden}
.notes h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin:0 0 10px}
.notes .why{font-size:14px;line-height:1.45;color:var(--ink2);margin-bottom:18px;padding:12px 14px;background:#fff;border:1px solid var(--line2);border-radius:10px}
.notes ol{list-style:none;counter-reset:n}
.notes li{position:relative;padding-left:34px;margin-bottom:12px;font-size:13.5px;line-height:1.42;color:var(--ink)}
.notes li b{font-weight:650}
.notes li::before{counter-increment:n;content:counter(n);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--note);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.notes .src{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
.foot{position:absolute;left:48px;right:48px;bottom:16px;font-size:11px;color:var(--ink3);display:flex;justify-content:space-between}
.pin{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--note);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff;z-index:20}

/* device frames */
.dev{position:relative;background:#fff;border:10px solid #2c2c2e;border-radius:28px;overflow:hidden;flex:none}
.ipad{width:1000px;height:700px}
.ipad.sm{width:500px;height:350px;border-width:6px;border-radius:16px}
.desk{width:1040px;height:660px;border-width:0;border-radius:10px;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.08)}
.desk .bar{height:30px;background:var(--fill2);display:flex;align-items:center;gap:6px;padding-left:12px;border-bottom:1px solid var(--line)}
.desk .bar i{width:10px;height:10px;border-radius:50%;background:#c7c7cc;display:block}
.desk .bar span{margin-left:16px;font-size:11px;color:var(--ink3);background:#fff;border-radius:5px;padding:2px 60px}
.phone{width:300px;height:640px;border-radius:40px;border-width:9px}
.scr{position:absolute;inset:0;font-size:12px}
.desk .scr{top:30px}
.sm .scr{transform:scale(.5);transform-origin:0 0;width:200%;height:200%}

/* wireframe primitives */
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}
.sb{justify-content:space-between}
.f1{flex:1;min-width:0}
.t10{font-size:10px}.t11{font-size:11px}.t12{font-size:12px}.t13{font-size:13px}.t14{font-size:14px}.t16{font-size:16px}.t18{font-size:18px}.t20{font-size:20px}.t24{font-size:24px}.t28{font-size:28px}.t36{font-size:36px}
.b{font-weight:650}.m{color:var(--ink3)}.m2{color:var(--ink2)}
.up{text-transform:uppercase;letter-spacing:.06em}
.box{border:1.5px solid var(--line);border-radius:12px;background:#fff}
.soft{background:var(--fill);border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border-radius:20px;background:var(--ink);color:#fff;font-weight:650;font-size:13px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.quiet{background:var(--fill2);color:var(--ink)}
.btn.big{height:56px;border-radius:28px;font-size:16px;padding:0 28px}
.btn.sm{height:30px;font-size:11.5px;padding:0 12px}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:10.5px;font-weight:650;background:var(--fill2);color:var(--ink2);white-space:nowrap}
.pill.dk{background:var(--ink);color:#fff}
.pill.ol{background:#fff;border:1px solid var(--ink3)}
.ln{height:8px;border-radius:4px;background:var(--line2)}
.img{background:repeating-linear-gradient(45deg,#ececf0 0 8px,#e2e2e7 8px 16px);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px}
.cam{background:#3a3a3c;color:#d1d1d6;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;position:relative;overflow:hidden}
.cam::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px)}
.rec{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:700;z-index:2}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff453a}
.glass{background:rgba(255,255,255,.86);border:1px solid rgba(0,0,0,.08);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.12);backdrop-filter:blur(8px)}
.divi{height:1px;background:var(--line2)}
.ic{width:18px;height:18px;border-radius:5px;background:var(--line);flex:none}
.ic.c{border-radius:50%}
.sq{width:30px;height:30px;border-radius:8px;background:var(--fill2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink2);font-size:12px}
.listrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line2)}
.seg{display:flex;background:var(--fill2);border-radius:10px;padding:3px}
.seg span{flex:1;text-align:center;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink2)}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tog{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--ink)}.tog.on::after{left:18px}
.field{height:40px;border:1.5px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 12px;color:var(--ink3);font-size:13px;background:#fff}
.check{width:18px;height:18px;border:1.5px solid var(--ink2);border-radius:5px;flex:none}
.check.on{background:var(--ink);border-color:var(--ink)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:56px;border-top:1px solid var(--line2);background:#fff;display:flex;justify-content:space-around;align-items:center}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--ink3)}
.tabbar div.on{color:var(--ink);font-weight:650}
.tabbar i{width:20px;height:20px;border-radius:6px;background:var(--line);display:block}
.tabbar div.on i{background:var(--ink)}
.side{width:200px;border-right:1px solid var(--line2);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:#fbfbfc}
.side div{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--ink2)}
.side div.on{background:var(--fill2);color:var(--ink);font-weight:650}
.side i{width:14px;height:14px;border-radius:4px;background:var(--line);display:block}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink3);font-size:10.5px;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line2)}
.mk{position:absolute;top:-5px;width:3px;height:18px;border-radius:2px;background:var(--ink)}
.mk.l{background:var(--ink3)}

/* cover & text pages */
.cover h1{font-size:76px;letter-spacing:-2px;font-weight:700}
.prose{font-size:16px;line-height:1.55;color:var(--ink2)}
.prose b{color:var(--ink)}
.kv{display:grid;grid-template-columns:180px 1fr;gap:10px 18px;font-size:14px;line-height:1.45}
.kv dt{color:var(--ink3)}
.flowbox{border:1.5px solid var(--ink);border-radius:10px;background:#fff;padding:8px 10px;font-size:12px;line-height:1.3;width:132px;position:relative}
.flowbox b{display:block;font-size:10px;color:var(--note);letter-spacing:.05em}
.arrow{color:var(--ink3);font-size:18px}
</style>
</head>
<body>
<div id="out"></div>
<script>
/* ---------- helpers ---------- */
const H = s => s;
let pageNo = 0;
const TOTAL = '{{TOTAL}}';

function page({title, flow, id, stage, notes, why, pins=[], stageStyle=''}) {
  pageNo++;
  const pinHtml = pins.map((p,i)=>`<div class="pin" data-t="${typeof p==='string'?encodeURIComponent(p):''}" data-s="${p.s||''}">${i+1}</div>`).join('');
  return `<section class="page">
    <div class="ph"><h1>${id?`<span class="m" style="font-weight:500">${id}&nbsp;&nbsp;</span>`:''}${title}</h1>
      <div class="tag">${flow?`<span class="chip ${flow==='Driver'?'solid':''}">${flow}</span>`:''}<span>FreshRoute · mid-fidelity wireframes v1</span></div></div>
    <div class="stage" style="${stageStyle}">${stage}</div>
    <div class="pins" style="position:absolute;inset:0;pointer-events:none">${pinHtml}</div>
    <div class="notes">${why?`<div class="why">${why}</div>`:''}<h2>Annotations</h2><ol>${notes.map(n=>`<li>${n}</li>`).join('')}</ol></div>
    <div class="foot"><span>Grayscale on purpose: this round is about structure, flow and content, not visual style.</span><span>${pageNo} / ${TOTAL}</span></div>
  </section>`;
}

/* simple map drawing; w,h in px; opts: route (array of [x,y] in 0-1), pins [{x,y,t:'p'|'r',sel,label}], user [x,y] */
function map(w,h,o={}) {
  const roads = [
    [[0,.18],[1,.22]],[[0,.52],[.55,.5],[1,.58]],[[0,.82],[1,.78]],
    [[.14,0],[.18,1]],[[.42,0],[.38,.5],[.46,1]],[[.7,0],[.74,1]],[[.9,0],[.86,1]],
    [[.18,.82],[.42,.66],[.74,.6]],[[.46,.18],[.7,.36],[.9,.4]]
  ];
  const P = a => a.map(p=>`${(p[0]*w).toFixed(1)},${(p[1]*h).toFixed(1)}`).join(' ');
  let s = `<svg class="map" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
   <rect width="${w}" height="${h}" fill="#ececea"/>
   <rect x="${w*.2}" y="${h*.26}" width="${w*.16}" height="${h*.2}" rx="6" fill="#e3e6df"/>
   <rect x="${w*.76}" y="${h*.64}" width="${w*.08}" height="${h*.12}" rx="6" fill="#e3e6df"/>`;
  roads.forEach((r,i)=>{ s+=`<polyline points="${P(r)}" fill="none" stroke="#fff" stroke-width="${i<3?9:7}" stroke-linecap="round" stroke-linejoin="round"/>`; });
  if (o.route) s+=`<polyline points="${P(o.route)}" fill="none" stroke="#1c1c1e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
  (o.pins||[]).forEach(p=>{
    const x=p.x*w,y=p.y*h, z=p.sel?1.35:1;
    if(p.t==='r'){ s+=`<g transform="translate(${x},${y}) scale(${z})"><circle r="11" fill="${p.sel?'#1c1c1e':'#fff'}" stroke="#1c1c1e" stroke-width="2"/><text y="4.5" text-anchor="middle" font-size="13" font-weight="800" fill="${p.sel?'#fff':'#1c1c1e'}">!</text></g>`; }
    else if(p.t==='f'){ s+=`<g transform="translate(${x},${y}) scale(${z})"><rect x="-12" y="-12" width="24" height="24" rx="5" fill="#fff" stroke="#1c1c1e" stroke-width="2"/><text y="4.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1c1c1e">FB</text></g>`; }
    else if(p.t==='n'){ s+=`<g transform="translate(${x},${y})"><circle r="10" fill="#1c1c1e"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${p.label}</text></g>`; }
    else { s+=`<g transform="translate(${x},${y}) scale(${z})"><rect x="-10" y="-10" width="20" height="20" rx="4" fill="${p.sel?'#1c1c1e':'#636366'}"/><rect x="-4" y="-4" width="8" height="8" rx="1" fill="#fff"/></g>`; }
    if (p.label && p.t!=='n') s+=`<text x="${x+16}" y="${y+4}" font-size="11" font-weight="600" fill="#48484a">${p.label}</text>`;
  });
  if (o.user) { const [x,y]=o.user; s+=`<circle cx="${x*w}" cy="${y*h}" r="18" fill="#1c1c1e" opacity=".12"/><circle cx="${x*w}" cy="${y*h}" r="8" fill="#1c1c1e" stroke="#fff" stroke-width="3"/>`; if(o.heading) s+=`<path d="M ${x*w} ${y*h-22} l 7 10 l -14 0 z" fill="#1c1c1e"/>`; }
  return s+'</svg>';
}

function ring(size, pct, big, small, opts={}) {
  const r=size/2-opts.sw/2-2||size/2-8, sw=opts.sw||10, c=2*Math.PI*r;
  const dash = opts.dash ? `stroke-dasharray="4 4"` : '';
  return `<div style="position:relative;width:${size}px;height:${size}px;flex:none">
   <svg width="${size}" height="${size}" style="position:absolute;inset:0;transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e5e5ea" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${opts.color||'#1c1c1e'}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}"/>
    ${opts.marker!=null?`<circle cx="${size/2+r*Math.cos(opts.marker*2*Math.PI)}" cy="${size/2+r*Math.sin(opts.marker*2*Math.PI)}" r="${sw/2+2}" fill="#fff" stroke="#1c1c1e" stroke-width="2"/>`:''}
   </svg>
   <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1">
     <div style="font-size:${opts.fs||size/5}px;font-weight:700;letter-spacing:-.5px">${big}</div>
     ${small?`<div style="font-size:${opts.fs2||Math.max(9,size/12)}px;color:#636366;margin-top:3px">${small}</div>`:''}
   </div></div>`;
}

const stopsBar = (stops, w='100%') => `<div class="stopsbar" style="position:relative;width:${w};height:30px">
  <div style="position:absolute;left:8px;right:8px;top:12px;height:4px;border-radius:2px;background:#e5e5ea"></div>
  <div style="position:absolute;left:8px;width:${stops.done}%;top:12px;height:4px;border-radius:2px;background:#1c1c1e"></div>
  ${stops.items.map(s=>`<div style="position:absolute;left:calc(${s.at}% - 9px);top:5px;width:18px;height:18px;border-radius:${s.home?'4px':'50%'};background:${s.state==='done'?'#1c1c1e':'#fff'};border:2px solid #1c1c1e"></div>
   <div style="position:absolute;left:calc(${s.at}% - 40px);width:80px;top:-12px;text-align:center;font-size:9.5px;color:#48484a;font-weight:600">${s.l||''}</div>`).join('')}
  ${stops.truck!=null?`<div style="position:absolute;left:calc(${stops.truck}% - 7px);top:6px;width:14px;height:16px;border-radius:3px;background:#1c1c1e;box-shadow:0 0 0 3px #fff"></div>`:''}
</div>`;

/* ---------- data ---------- */
const pickups = [
 {n:"Sam's Club · Loop 288", k:'Surplus', w:'420 lb · mixed dry goods', d:'2.1 mi · 7 min', t:'Ready 9:30–11:00', tags:['Shelf-stable','Fast handoff']},
 {n:'Kroger · S Loop 288', k:'Surplus', w:'180 lb · produce, dairy', d:'2.6 mi · 9 min', t:'Ready until 12:00', tags:['Needs cold storage']},
 {n:'Hands of Hope', k:'Surplus', w:'~60 lb · bread', d:'1.4 mi · 5 min', t:'After 1:30 pm', tags:['Shelf-stable']},
 {n:'Walmart · University Dr', k:'Surplus', w:'300 lb · canned goods', d:'3.4 mi · 11 min', t:'Ready 10:00–2:00', tags:['Scans every item · ~25 min']},
];
const rescues = [
 {n:'Milk, 12 gal', by:'Posted by Jordan R. · no cooler in truck', d:'Albertsons · 3.0 mi', t:'Spoils if not picked up by 11:30'},
 {n:'Frozen meals, 8 cases', by:'Posted by Priya S. · truck full', d:'WinCo · 4.2 mi', t:'Pick up by 12:15'},
];

/* ---------- pages ---------- */
const pages = [];

/* 1. Cover */
pages.push(`<section class="page cover">
  <div style="position:absolute;left:96px;top:120px;right:96px">
    <div class="m t14 up b" style="letter-spacing:.14em">Maroon Moose · UX case study</div>
    <h1 style="margin-top:18px">FreshRoute</h1>
    <div class="t28 m2" style="margin-top:6px;font-weight:450;letter-spacing:-.4px">Live ETAs, recorded drives and drive reports for food rescue drivers and the food banks waiting on them.</div>
    <div class="row g16" style="margin-top:64px;align-items:flex-start">
      <div class="box" style="padding:22px 24px;width:430px"><div class="b t18">Flow 1 · Driver</div><div class="prose t14" style="margin-top:8px;font-size:14px">iPad mounted in the van. Find surplus pickups and rescues, build a multi-stop route, drive with turn-by-turn and a recorded camera, then report what went wrong.</div><div class="m t12" style="margin-top:12px">Screens D1–D14 · iPad landscape first, phone supported</div></div>
      <div class="box" style="padding:22px 24px;width:430px"><div class="b t18">Flow 2 · Food bank manager</div><div class="prose t14" style="margin-top:8px;font-size:14px">Laptop at the desk, phone on the floor. See every truck that's coming, when it will really arrive, what's on it and how long the cold items have been out. Review drive reports and footage without asking the driver.</div><div class="m t12" style="margin-top:12px">Screens M1–M6 · desktop first, phone supported</div></div>
      <div class="box" style="padding:22px 24px;width:330px;border-style:dashed"><div class="b t18">Plus · Store link</div><div class="prose t14" style="margin-top:8px;font-size:14px">The team's winning concept: the grocery store gets the driver's ETA too, by text, with no account.</div><div class="m t12" style="margin-top:12px">Screen S1</div></div>
    </div>
    <dl class="kv" style="margin-top:56px;width:1000px">
      <dt>What to review</dt><dd>Does each screen do one job? Is anything missing between screens? Do the annotations match what you meant in the brief?</dd>
      <dt>Not in this round</dt><dd>Colour, type, Liquid Glass styling, motion and the Astryx components. Those come after you approve the structure.</dd>
      <dt>Left out on purpose</dt><dd>Gamification (encouragement, streaks, leaderboards). Your design studio voted it distracting and stressful for drivers.</dd>
      <dt>Date</dt><dd>November 19, 2026</dd>
    </dl>
  </div>
  <div class="foot"><span>Sample data: Denton, TX. Store names are used as realistic placeholders for the demo.</span><span>1 / ${TOTAL}</span></div>
</section>`);
pageNo = 1;

/* 2. Research → decisions */
pages.push(`<section class="page">
  <div class="ph"><h1>What the research decided</h1><div class="tag"><span>FreshRoute · mid-fidelity wireframes v1</span></div></div>
  <div style="position:absolute;left:48px;right:48px;top:118px">
  <table class="tbl" style="font-size:14px">
   <tr><th style="width:44%;font-size:12px">What we heard or found</th><th style="width:16%;font-size:12px">Source</th><th style="font-size:12px">What it becomes in FreshRoute</th></tr>
   ${[
    ['"You could be sending an important email and then it\'s like, oh, the truck\'s here."','Cody interview, Maya persona','Food bank gets a heads-up at 15 and 5 minutes out, plus a live board of incoming trucks (M1)'],
    ['The regional truck arrives "usually around 10 or 11", depending on traffic','Cody interview','An ETA promise is locked when the route starts and tracked against the live forecast (D8, D10, D13)'],
    ['Perishables get turned away when nobody knows how long they\'ve been out of the fridge','Cody, persona, journey map','A cold-chain timer starts when cold items are loaded and travels with the report (D9, M2)'],
    ['The van has no cooling; heavy loads need careful braking and turning','Cody interview','A cold-storage setting filters listings; hard brakes, sharp turns and bumps are marked on the video (D14, D13)'],
    ['Every store works differently: scan each can, unbox to scan, bagged cans','Cody, persona','"How pickup works here" and driver-reported drawbacks on every location (D5, M5)'],
    ['Vague listings led to five pallets of popcorn and 19 lb tubs of sour cream','Cody interview','Every listing shows pack size, count, weight and storage type up front (D4, D5)'],
    ['Solo pickups and untracked items are where shrinkage happens','Anti-persona (Max)','Recorded drive plus item counts at pickup and drop-off (D9, D11)'],
    ['Careit shows two status labels nobody understands, and its toast and status disagree','Heuristic audit #06, #30','One set of status words everywhere: Scheduled, On the way, At stop, Arrived'],

   <div class="btn big" style="width:100%">Start drive & record</div>
  </div>
 </div></div>`,
 why:'Browsers only grant motion sensors after a tap, and the camera must be running before the drive starts. This screen turns those technical requirements into a 10-second checklist.',
 notes:[
  '<b>Live camera preview</b> so the driver can aim the mount at the cargo before leaving.',
  '<b>Camera source</b>: front, back or an external USB-C camera. Same setting as D14.',
  '<b>Motion sensors need a tap</b>: iOS requires a user gesture to grant motion access. Unchecked items show the action, not just a red mark.',
  '<b>Screen stays on</b> uses the Wake Lock API, because recording stops if the iPad sleeps.',
  '<b>Storage check</b>: about 350 MB per hour at 720p. Warns before the drive, not halfway through.',
  '<b>Honest limit</b>: switching apps pauses recording. The gap shows in the report instead of failing silently.',
  '<b>Promise stated</b>: who gets which ETA. Then one button starts recording, navigation and notifications together.',
 ],
 pins:["Camera preview", "External (USB-C)", "Motion sensors", "Screen stays on", "Storage for video", "Mount the iPad", "Start drive & record"]}));

/* anchor annotation pins to the element they describe */
document.querySelectorAll('.page').forEach(pg=>{
  const stage = pg.querySelector('.stage'); if(!stage) return;
  const pr = pg.getBoundingClientRect();
  pg.querySelectorAll('.pins .pin').forEach(pin=>{
    let el=null;
    if (pin.dataset.s) el = stage.querySelector(pin.dataset.s);
    else if (pin.dataset.t) { const t=decodeURIComponent(pin.dataset.t);
      el=[...stage.querySelectorAll('*')].find(e=>e.textContent.includes(t)&&![...e.children].some(c=>c.textContent.includes(t))); }
    if(!el){ pin.style.display='none'; console.warn('pin not found', pin.dataset.t||pin.dataset.s); return; }
    const r=el.getBoundingClientRect();
    pin.style.left=(r.left-pr.left-27)+'px'; pin.style.top=(r.top-pr.top-4)+'px';
  });
});
